<!-- main/upload.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP-AudioPlayer</title>
    <style>
      body {
        font-family: sans-serif;
        background: #08090c;
        color: #f2f6ff;
        text-align: center;
        padding: 20px;
      }
      h1 {
        color: #00d5ff;
      }
      .card {
        background: #121620;
        border: 1px solid #263143;
        border-radius: 12px;
        padding: 20px;
        margin: 20px auto;
        max-width: 400px;
      }
      input[type="file"] {
        margin: 10px 0;
        color: #f2f6ff;
      }
      button {
        background: #00d5ff;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        background: #8a93a6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 15px;
        font-weight: bold;
        min-height: 20px;
      }
      #statusInfo {
        color: #8a93a6;
        margin-bottom: 15px;
        font-size: 14px;
      }
      .progress {
        width: 100%;
        background: #263143;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 10px;
        display: none;
      }
      .progress-bar {
        height: 8px;
        background: #00d5ff;
        width: 0%;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <h1>Wi-Fi Upload</h1>
    <div class="card">
      <div id="statusInfo">Loading SD card info...</div>
      <p>Select <b>.pcm</b> files (Raw 44.1kHz 16-bit Stereo).</p>
      <input type="file" id="fileInput" multiple accept=".pcm,.bmp" /><br />
      <button id="uploadBtn" onclick="uploadFiles()">Upload</button>
      <div class="progress" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div id="status"></div>
    </div>
    <script>
      async function loadStatus() {
        try {
          const res = await fetch("/status");
          const data = await res.json();
          document.getElementById("statusInfo").innerText =
            "Free Space: " +
            (data.free_mb >= 0 ? data.free_mb + " MB" : "Unknown") +
            " | Tracks: " +
            data.files.length;
        } catch (e) {
          document.getElementById("statusInfo").innerText =
            "Error reading SD card status.";
        }
      }

      async function uploadFiles() {
        const files = document.getElementById("fileInput").files;
        const status = document.getElementById("status");
        const btn = document.getElementById("uploadBtn");
        const progContainer = document.getElementById("progressContainer");
        const progBar = document.getElementById("progressBar");

        if (files.length === 0) {
          status.textContent = "Please select files.";
          return;
        }

        btn.disabled = true;
        progContainer.style.display = "block";

        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          status.textContent =
            "Uploading " +
            file.name +
            " (" +
            (i + 1) +
            "/" +
            files.length +
            ")...";
          progBar.style.width = "0%";

          try {
            await uploadSingleFile(file, progBar);
            status.textContent = file.name + " OK!";
          } catch (e) {
            status.textContent = "Error: " + e.message;
            btn.disabled = false;
            return;
          }
        }

        status.textContent = "All files uploaded!";
        btn.disabled = false;
        progBar.style.width = "100%";

        loadStatus();
      }

      function uploadSingleFile(file, progBar) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const url = "/upload?filename=" + encodeURIComponent(file.name);

          xhr.open("POST", url, true);
          xhr.setRequestHeader("Content-Type", "application/octet-stream");

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              progBar.style.width = (e.loaded / e.total) * 100 + "%";
            }
          };

          xhr.onload = () => {
            if (xhr.status === 200) {
              resolve();
            } else {
              reject(new Error(xhr.responseText || "Server error"));
            }
          };

          xhr.onerror = () => reject(new Error("Network error"));

          xhr.send(file);
        });
      }

      window.onload = loadStatus;
    </script>
  </body>
</html>
